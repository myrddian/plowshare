org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Pinned versions for sub-module build files.
# Copied from Anchor's gradle.properties rather than resolved fresh: the two
# projects are meant to stay on one toolchain and will eventually share a
# machine, so a version that drifts here is a version that has to be reconciled
# later against a codebase already built on it.
springBootVersion=3.3.5
springDependencyManagementVersion=1.1.6
pgvectorJdbcVersion=0.1.6
okhttpVersion=4.12.0
jacksonVersion=2.17.2
flywayVersion=10.20.1
testcontainersVersion=1.20.3
springdocVersion=2.6.0

# The client is not a Spring Boot module, so it has to name its own logging
# backend. 1.5.11 is the version Spring Boot 3.3.5 already manages for the
# server: the two ship together, and two logback versions in one repo is a
# second CVE to track and a second set of config semantics to remember.
logbackVersion=1.5.11

# The one library that reads a format the JDK cannot. It is named here rather
# than inline because it is the only third-party dependency in this repository
# that exists to read somebody's file, and a version of it is a thing an
# operator has to be able to find. IT IS NOW IN TWO MODULES -- the client, in
# front of file_read, and the server, in front of ingest -- and one pin is the
# whole reason those two cannot drift onto different parsers of the same format.
#
# MEASURED on this tree, three modules both times -- pdfbox, fontbox, pdfbox-io:
#
#   client (`./gradlew :plowshare-client:dependencies`)  3.58 MiB
#   server (resolved runtimeClasspath, 55 -> 58 modules) 3.59 MiB, 3,759,710 B
#
# The client's figure is the same shape as the number the Documents slice
# recorded before reverting it (3 modules / 3.5 MB at 3.0.3), and the server's
# was re-measured rather than copied because the two dependency graphs differ.
# The comparison both were recorded against stands: tika-parsers-standard-package
# brings EIGHTY.
#
# commons-logging is the fourth module PDFBox declares and BOTH builds exclude
# it, for related but not identical reasons, and the substitutions differ:
#
#   - plowshare-client substitutes org.slf4j:jcl-over-slf4j (18 KB), because
#     that module has no other provider of the package and the rule is about
#     stdout, which is its MCP protocol channel;
#   - plowshare-server substitutes NOTHING, because spring-jcl is already there
#     and already is that bridge. Adding a second would recreate the two-jars-
#     one-package problem the exclusion exists to prevent.
#
# See each build file, and the two tests that assert the resolution rather than
# the comments: ConvertedTextStaysOffStdoutTest and PdfWarningsGoThroughLogbackTest.
pdfboxVersion=3.0.7

# The one HTML parser in this repository. There is no other candidate: regex
# over markup is the canonical wrong answer to "find the article inside this
# page" (a nested tag, an unescaped `>` inside an attribute, or a comment
# containing a `<` breaks it, and it degrades silently rather than failing
# loud), and the JDK ships nothing that parses real-world tag soup at all —
# no unclosed tags, no implied `<tbody>`, no HTML5 error-recovery rules. jsoup
# is one jar, and it is what the reference implementation reaches for to do
# exactly this: turn arbitrary remote HTML into a DOM a CSS selector can walk.
#
# The cost is real and is not free just because the jar is small: this puts a
# third-party parser directly on the path that ingests untrusted markup fetched
# from the open web, which is a different threat model from PDFBox's — that
# library reads files an operator chose to hand this server, not bytes a page
# on the internet served on request.
jsoupVersion=1.18.1

# Git for union projects: the server's hub and its smart-HTTP endpoint. Pure Java,
# so the server needs no git binary. Spec 2026-09-14-a-project-can-be-a-union.
jgitVersion=7.8.0.202609011348-r
# The 23.1 line and not 24/25: it is the Graal compiler line that links against
# JDK 21, so enabling the compiler later is JVM flags, not a version change. See
# the hooks spec §7.1.
graalPolyglotVersion=23.1.12
swc4jVersion=2.2.0
