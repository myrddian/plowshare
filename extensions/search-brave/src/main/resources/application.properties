# The Brave provider. Port 8084 — distinct from search-searxng's 8086 and
# plowshare-server's own 8091, so all three can run on one box without a
# collision an operator has to discover at boot.
server.port=${BRAVE_PORT:8084}

# Loopback only, and this is a security default rather than a convenience one.
# Spring's own default bind is 0.0.0.0: without this line, anyone who can
# reach port 8084 on this box — every other host on the LAN, and every
# container sharing the network — can POST /v1/search and spend the
# operator's Brave quota through the key that never enters Plowshare. The
# out-of-process credential argument (spec §3, BraveProperties' javadoc) is
# sound about the blast radius it removes from Plowshare and silent about the
# one it creates here: the key stops being reachable through Plowshare and
# starts being spendable through an unauthenticated HTTP port.
#
# There is no authentication on this process at all — that is the honest
# statement of what this line is standing in for. A shared secret between
# Plowshare and each provider is a real design and belongs in a later slice
# with the privilege tier that registration also wants (spec cost 6); binding
# to loopback is not that, it is the narrowest reachable surface available
# without one.
#
# To widen it deliberately — a provider on a different host from the server
# — set BRAVE_BIND to that interface, or to 0.0.0.0, and understand that the
# port is then open to whoever can route to it.
server.address=${BRAVE_BIND:127.0.0.1}

# Brave's own API origin. There IS a well-known default, unlike SearXNG's:
# Brave runs one public service at one address, so this is worth defaulting
# rather than leaving every operator to look it up and paste it back in.
plowshare.ext.brave.base-url=${BRAVE_BASE_URL:https://api.search.brave.com}
plowshare.ext.brave.timeout-ms=${BRAVE_TIMEOUT_MS:5000}
plowshare.ext.brave.max-results=${BRAVE_MAX_RESULTS:20}

# Deliberately absent: plowshare.ext.brave.api-key. Brave's vendor credential
# is read from SEARCH_BRAVE_API_KEY, a plain OS environment variable, by
# BraveApplication directly — never through a Spring configuration property.
# See BraveProperties's javadoc for why that boundary is load-bearing rather
# than a style choice.
