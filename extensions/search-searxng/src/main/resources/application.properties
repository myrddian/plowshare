# The SearXNG provider. Port one above plowshare-server's own 8091, and
# distinct from search-brave's 8084 so both providers and the server itself
# can run on one box without a collision an operator has to discover at boot.
server.port=${SEARXNG_PORT:8086}

# Loopback only, for the reason search-brave's own properties file argues in
# full: Spring's default bind is 0.0.0.0, and this process answers POST
# /v1/search with no authentication of any kind. The quota argument is weaker
# here — a self-hosted SearXNG usually costs the operator nothing per query
# — but the other two halves are not: an open port is a free search proxy for
# anyone on the network, and it is an unauthenticated way to make this box
# issue outbound requests to whatever the operator's SearXNG will relay. The
# default is the same for the same reason, and the two files agree
# deliberately rather than by accident.
#
# To widen it deliberately — a provider on a different host from the server
# — set SEARXNG_BIND to that interface, or to 0.0.0.0, and understand that
# the port is then open to whoever can route to it.
server.address=${SEARXNG_BIND:127.0.0.1}

# Where the operator's own SearXNG instance answers. No default worth guessing
# at — a self-hosted metasearch engine has no well-known public address the
# way Brave's API does, so this is left for the operator to set rather than
# pointed at a host that would silently be wrong for everyone else.
plowshare.ext.searxng.base-url=${SEARXNG_BASE_URL:http://localhost:8080}
plowshare.ext.searxng.timeout-ms=${SEARXNG_TIMEOUT_MS:5000}
plowshare.ext.searxng.max-results=${SEARXNG_MAX_RESULTS:25}
