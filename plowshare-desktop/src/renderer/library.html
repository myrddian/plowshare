<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Library</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"><link rel="stylesheet" href="library.css"><script src="library.js" defer></script></head>
<body class="activity-window embedded-view"><header class="titlebar"><div class="window-space"></div><span class="trajectory-title">Library</span><span class="trajectory-connection" id="library-connection"></span></header>
<main class="activity-workspace"><header class="activity-toolbar"><div><h1><span data-icon="search"></span><span id="library-title">Library</span></h1><p id="library-description">Generated reports, consumed documents and search</p></div><div class="activity-tabs" role="tablist" aria-label="Library"><button id="library-manual" role="tab" aria-controls="library-manual-panel">Manual</button><button id="library-sources" role="tab" aria-controls="library-source-panel">Reports</button><button id="library-documents" role="tab" aria-controls="library-panel">Documents</button><button id="library-memories" role="tab" aria-controls="library-panel">Memories</button><button id="library-search" role="tab" aria-controls="library-panel">Search</button></div><div id="report-filter" hidden></div><button id="library-refresh"><span data-icon="refresh"></span>Refresh</button></header>

<div id="library-error" class="error-banner" role="alert" hidden></div><div id="library-notice" class="run-notice" role="status" hidden></div>
<div class="library-controls"><label id="library-scope-label">Memory and conversation scope<select id="library-scope"><option value="">Global</option></select></label><form id="document-filter"><label>Server corpus<input id="document-query" type="search" placeholder="Filter title, source or summary…"></label><button type="submit">Find documents</button></form><form id="search-form" hidden><label>Search method<select id="search-kind"><option value="conversation">Conversations</option><option value="documents">Document passages</option><option value="retrieve">Document hierarchy retrieval</option><option value="rank">Rank documents</option><option value="recall">Recall memories</option><option value="navigate">Navigate memories (uses a model)</option></select></label><label id="search-mode-label">Mode<select id="search-mode"><option value="hybrid">Hybrid</option><option value="lexical">Lexical</option><option value="semantic">Semantic</option></select></label><label class="library-query">Question<input id="search-query" type="search" placeholder="What are you looking for?" required></label><button type="submit">Search</button></form></div>
<details id="document-sources" class="document-sources" hidden><summary>Manage document sources and imports</summary><section id="document-source-panel"></section></details>
<section id="library-manual-panel" role="tabpanel" aria-labelledby="library-manual" hidden></section>
<section id="library-source-panel" role="tabpanel" aria-labelledby="library-sources" hidden></section>
<p id="library-scope-note" class="library-note"></p><div id="library-panel" role="tabpanel"><div id="library-results"></div><section id="library-detail" class="activity-detail" tabindex="0"></section></div>
</main></body></html>
