[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plowshare-agile"
version = "0.1.0"
description = "A small agile Application using the public Plowshare SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["plowshare-sdk==0.1.0"]

[project.scripts]
plowshare-agile = "plowshare_agile.cli:main"
furrow = "plowshare_agile.cli:main"
excalibur = "plowshare_agile.cli:main"

[project.optional-dependencies]
web = ["aiohttp>=3.12,<4"]
check = ["mypy==2.4.0", "ruff==0.16.10", "build==1.6.1", "aiohttp>=3.12,<4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["plowshare_agile*"]

[tool.setuptools.package-data]
plowshare_agile = ["schemas/*.json", "application/plowshare.json", "application/skills/*/SKILL.md", "web/*", "config.example.toml", "py.typed"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
