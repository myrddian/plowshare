[project]
name = "plowshare-home-assistant-assist-checks"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["homeassistant==2026.9.4", "websockets>=17,<18"]

[project.optional-dependencies]
check = ["ruff==0.16.10", "gazetteer-matcher==1.1.0", "hassil==3.12.1", "home-assistant-intents==2026.8.28"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

