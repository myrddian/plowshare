name: plowshare
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: plowshare
      POSTGRES_USER: plowshare
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    volumes:
      - ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/postgres:/var/lib/postgresql/data
    command: [postgres, -c, shared_buffers=512MB, -c, work_mem=8MB, -c, maintenance_work_mem=128MB]
    shm_size: 256m
    mem_limit: 3g
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  server:
    image: plowshare/server:${PLOWSHARE_VERSION:-0.1.0}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
      args:
        SOURCE_REVISION: ${PLOWSHARE_SOURCE_REVISION:-unknown}
    env_file:
      - path: ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/config/models.env
        format: raw
    environment:
      PLOWSHARE_DB_URL: jdbc:postgresql://postgres:5432/plowshare
      PLOWSHARE_DB_USER: plowshare
      PLOWSHARE_DB_PASSWORD_FILE: /run/secrets/database-password
      PLOWSHARE_ADMIN_HANDLE: ${PLOWSHARE_ADMIN_HANDLE:-}
      PLOWSHARE_ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      PLOWSHARE_AUTH_ENABLED: "true"
      PLOWSHARE_PROJECTS_WORKSPACE_DIRECTORY: /var/lib/plowshare-workspaces
      PLOWSHARE_PERSONAL_SEND_TO_ANY_PROJECT: ${PLOWSHARE_PERSONAL_SEND_TO_ANY_PROJECT:-true}
      PLOWSHARE_PERSONAL_ACCEPT_FROM_ANY_PROJECT: ${PLOWSHARE_PERSONAL_ACCEPT_FROM_ANY_PROJECT:-true}
      PLOWSHARE_SEARCH_LADDER: ${PLOWSHARE_SEARCH_LADDER:-}
      PLOWSHARE_SEARCH_TIMEOUT: ${PLOWSHARE_SEARCH_TIMEOUT:-PT20S}
      JAVA_TOOL_OPTIONS: ${PLOWSHARE_JAVA_TOOL_OPTIONS:--Xms256m -Xmx3g -Djava.awt.headless=true}
    secrets:
      - database-password
      - admin-password
    volumes:
      - ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/data:/var/lib/plowshare
      - ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/workspaces:/var/lib/plowshare-workspaces
      - ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/config:/etc/plowshare:ro
    ports:
      - ${PLOWSHARE_LISTEN_ADDRESS:-127.0.0.1}:${PLOWSHARE_PUBLISHED_PORT:-8091}:8091
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 5g
    read_only: true
    tmpfs:
      # JNA/Argon2 and SWC extract native libraries here and mmap executable code.
      - /tmp:size=512m,mode=1777,exec
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  database-password:
    file: ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/secrets/database-password
  admin-password:
    file: ${PLOWSHARE_STATE_ROOT:-/srv/plowshare}/secrets/admin-password
