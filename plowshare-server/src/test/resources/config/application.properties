# A ticker started from a bean would fire schedules against the live test database
# on a clock no test controls (Retention's second reason). Spring Boot reads
# classpath:/config/ after classpath:/, so this wins in every @SpringBootTest.
plowshare.events.ticker-enabled=false
# Boot recovery abandons, rolls forward and drains firings in whatever database the
# context reaches; no test context should do that just by starting.
plowshare.events.recover-at-boot=false
# Orchestration recovery restarts conductors and delivers undelivered messages in whatever
# database the context reaches; no test context should speak to a conductor just by starting.
plowshare.orchestrations.recover-at-boot=false
# The stall sweep judges runs quiet, and notices an account, in whatever database this context
# reaches, on a clock no test controls; no test context should do that just by starting.
plowshare.orchestrations.stall-sweep-enabled=false

# No automatic board recovery in test contexts.
plowshare.swarm.recover-at-boot=false
