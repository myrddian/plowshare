# A deadlock fails this build instead of hanging it.
#
# Until slice 3c the only bounds in this suite were OpenAiTransportTest's
# class-level @Timeout and one method in FileChannelTest. Everywhere else the
# thing keeping a wedged test from stopping the build was the discipline of
# writing bounded latch awaits — real discipline, but discipline rather than a
# mechanism, and nothing fails when somebody forgets.
#
# ONE OF THREE BYTE-IDENTICAL COPIES: plowshare-protocol, plowshare-server and
# plowshare-client each need their own, because JUnit reads this file from the
# root of the classpath of the module under test and a copy on the wrong
# classpath is ignored in silence. Edit one, edit all three. It is a file rather
# than a systemProperty on the root `tasks.withType<Test>` so that a test run
# from an IDE is bounded too.
#
# WHY 120 SECONDS. Measured at slice 3c on this developer's machine: the whole
# suite — 1370 tests, 57 classes — runs green with this bound set to 5 seconds,
# so no test method and no lifecycle method on it takes longer than that. The
# slowest single method is ProposalStoreTest's two-concurrent-writers pair at
# about 1.5s, and the whole suite is 52 seconds of wall clock. 120s is therefore
# roughly 24x the measured ceiling for any one method and more than twice the
# entire suite: a CI host would have to be an order of magnitude slower than
# this one before the bound turned a slow test into a flaky one, which would be
# worse than the hang it replaces. It is also small enough to fire well inside
# any plausible CI job budget — a bound of five minutes can be outlived by the
# harness that was supposed to report it.
#
# WHY THE THREAD MODE IS SET AND NOT LEFT AT ITS DEFAULT. Without this second
# line the first one is an instrument that cannot record the fault it is cited
# for. Measured, with a test that ignores interrupts for 20 seconds and a bound
# of 2: under SAME_THREAD, JUnit's default, the build took 20.6s and reported
# the timeout only once the method had returned of its own accord; under
# SEPARATE_THREAD it took 2.6s. SAME_THREAD does interrupt the test thread — an
# earlier probe using Thread.sleep failed at 2.6s under it — but an interrupt is
# a request, and a real deadlock is exactly the case that declines it and never
# returns. SEPARATE_THREAD abandons the thread instead. The abandoned thread
# does keep running; the build stops waiting for it, which is the point.
#
# WHAT THIS DOES NOT BOUND, so that nobody raises the number to make room for
# it. A Testcontainers container start is not covered. Measured with the bound
# at 1ms: LocalProviderTest failed inside its own @BeforeAll `migrate()`, below
# a log line reading "Container pgvector/pgvector:pg16 started in PT0.628618S".
# The container is started by the extension's BeforeAllCallback, and JUnit times
# user lifecycle methods rather than extension callbacks — so a cold image pull
# on a fresh CI runner cannot trip this. User @BeforeAll and @BeforeEach methods
# ARE bounded, and are inside the 5-second measurement above.
#
# A malformed value here is ignored with a WARNING on the test worker's stderr
# and no timeout at all — measured, with `120 seconds`, which is not the format.
# The format is <number> [ns|μs|ms|s|m|h|d].
junit.jupiter.execution.timeout.default = 120 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
