# Minimal single-pool example. Copy outside Git and supply the LLM_* values.
# Launch with bin/plowshare --config /absolute/path/application.yml.
# Chat and embeddings share an endpoint. Both chat classes use the same model.
# Declare additional pools only when your installation needs them.
plowshare:
  llm:
    embedding-model: ${LLM_EMBEDDING_MODEL}
    classes:
      fast: ${LLM_CHAT_MODEL}
      reasoning: ${LLM_CHAT_MODEL}
    pools:
      - name: inference
        base-url: ${LLM_BASE_URL}
        api-key: ${LLM_API_KEY:}
        provider: ${LLM_PROVIDER:openai}
        models:
          - ${LLM_CHAT_MODEL}
          - ${LLM_EMBEDDING_MODEL}
        chat: ${LLM_CHAT_SLOTS:1}
        embedding: ${LLM_EMBEDDING_SLOTS:1}
        swarm: ${LLM_SWARM_SLOTS:0}
