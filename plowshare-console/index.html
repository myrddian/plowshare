<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- All resources, including licensed fonts, are served from this origin.
      Referrers stay disabled before auth.ts removes a bootstrap credential. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/themes/print.css" />
    <title>Plowshare</title>
  </head>
  <body>
    <!--
      Empty on purpose. Everything below this line is built as DOM by
      `src/main.ts` -- there is no template with a hole in it for a value to be
      interpolated into, which is the whole of how `no innerHTML with
      interpolated content` is kept true rather than remembered.
    -->
    <main id="console"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
